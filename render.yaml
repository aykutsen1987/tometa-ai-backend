services:
  - type: web
    name: tometa-ai-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_SECRET
        sync: false          # Dashboard'dan elle gir (uygulamadaki ApiService.Security.APP_SECRET ile aynı)
      - key: GEMINI_API_KEY
        sync: false          # https://aistudio.google.com/apikey
      - key: GROQ_API_KEY
        sync: false          # https://console.groq.com/keys
      # İsteğe bağlı (boş bırakırsan modeller otomatik seçilir):
      # GEMINI_MODELS, GROQ_VISION_MODELS, GROQ_WHISPER_MODELS, GEMINI_MAX_OUTPUT
